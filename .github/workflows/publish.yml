# Regenerates index.json and publishes it.
#
# The schedule is the point, not a nicety: it re-installs the newest version of
# every listed library and measures it against the current compiler, so an entry
# describes what builds today. A library that stops building gets marked broken
# without anyone filing an issue.
name: publish

on:
  push:
    branches: [main]
    paths:
      - libraries.txt
      # Changing the pipeline runs it. Without this, the fix for a broken
      # regeneration sat in main unverified: the run that had published two
      # working libraries as `broken` was still the latest one, and nothing
      # re-measured until someone edited the list or a week went by.
      - .github/workflows/publish.yml
  schedule:
    # Weekly, early Monday UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked before anything expensive runs, and before the mirror commit --
      # a missing or empty secret would otherwise surface as an opaque failure
      # from the AWS CLI, after the whole measurement had already happened.
      - name: Check the publishing secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing or empty repository secrets:$missing" >&2
            echo "Set them with: gh secret set <NAME> --repo PyMCU/pymcu-libraries" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      # The compiler goes INSIDE the environment being measured, and the
      # measuring is done by that copy of pymcu. With the compiler installed
      # --system and the libraries in a separate venv, the two cannot see each
      # other: every example failed with "Module not found: dht", and the run
      # published both libraries as `broken` while they built fine everywhere
      # else. [all] because the matrix states which architectures a library
      # supports, and a backend this runner lacks would be recorded as the
      # library not supporting it.
      - name: Prepare the measuring environment
        run: |
          uv venv .index-venv
          uv pip install --python .index-venv --prerelease=allow "pymcu-compiler[all]"
          grep -v '^\s*#' libraries.txt | grep -v '^\s*$' | while read -r dist; do
            uv pip install --python .index-venv --prerelease=allow "$dist"
          done

      - name: Build the index
        run: .index-venv/bin/pymcu index build --venv .index-venv --output index.json

      # A regeneration in which nothing builds anywhere is a broken pipeline,
      # not a catalogue of broken libraries. Publishing it marks every entry
      # `broken`, and `pymcu install` then warns users away from libraries
      # that work -- which is exactly what happened the first time this ran.
      - name: Refuse an index in which nothing builds
        run: |
          python - <<'CHECK'
          import json, sys
          index = json.load(open("index.json"))
          entries = index["libraries"]
          if not entries:
              sys.exit("index.json lists no libraries at all")
          building = [
              e["name"] for e in entries
              if any(t.get("build") == "ok" for t in e["measured"]["targets"].values())
          ]
          print(f"{len(building)}/{len(entries)} libraries build somewhere")
          if not building:
              sys.exit(
                  "No library built for any chip. That is a fault of this "
                  "pipeline, not of the libraries; refusing to publish."
              )
          CHECK

      - name: Commit the mirror
        run: |
          git config user.name "pymcu-bot"
          git config user.email "bot@pymcu.org"
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git add index.json
          git commit -m "chore: regenerate index.json"
          git push

      # Uploaded through R2's S3 endpoint rather than the public hostname: the
      # pymcu.org zone answers 403 to data centres under Bot Fight Mode, and a
      # GitHub runner is one. The endpoint lives outside the zone.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp index.json s3://pymcu-libraries/index.json \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache"

      # The Worker is NOT redeployed here. It reads index.json from R2 on every
      # request and caches nothing, so uploading the object is what publishes the
      # new catalogue -- redeploying identical code changes nothing. It also
      # cannot work: the CI token is an R2 Storage token, and deploying a Worker
      # needs Workers Scripts: Edit, which that kind of token does not carry. The
      # step failed every run while the content published correctly.
      # deploy-worker.yml handles the Worker, and only when its code changes.
