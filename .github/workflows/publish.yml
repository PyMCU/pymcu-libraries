# Regenerates index.json and publishes it.
#
# The schedule is the point, not a nicety: it re-installs the newest version of
# every listed library and measures it against the current compiler, so an entry
# describes what builds today. A library that stops building gets marked broken
# without anyone filing an issue.
name: publish

on:
  push:
    branches: [main]
    paths:
      - libraries.txt
  schedule:
    # Weekly, early Monday UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install the compiler
        run: uv pip install --system --prerelease=allow "pymcu-compiler[all]"

      - name: Build the index
        run: pymcu index build --from libraries.txt --venv .index-venv --output index.json

      - name: Commit the mirror
        run: |
          git config user.name "pymcu-bot"
          git config user.email "bot@pymcu.org"
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git add index.json
          git commit -m "chore: regenerate index.json"
          git push

      # Uploaded through R2's S3 endpoint rather than the public hostname: the
      # pymcu.org zone answers 403 to data centres under Bot Fight Mode, and a
      # GitHub runner is one. The endpoint lives outside the zone.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp index.json s3://pymcu-libraries/index.json \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler deploy -c deploy/wrangler.toml
